<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WINTER CD PLAYER</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --case-bg: #e6e6e6;
      --disc-size: 260px;
    }

    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow-x: hidden;
    }

    .player-outer-wrap {
      width: 100%;
      max-width: 440px;
      background: #252525;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 專輯切換按鈕區 - 支援手機雙排排列 */
    .album-switch-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .album-btn {
      flex: 1 1 calc(50% - 6px); /* 手機版自動變兩排 */
      max-width: 200px;
      background: #3a3a3a;
      border: 1px solid #555;
      color: #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s, color 0.2s;
    }
    .album-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    /* CD 倉與光碟本體 */
    .cd-case {
      width: var(--disc-size);
      height: var(--disc-size);
      background: radial-gradient(circle, #333 0%, #151515 100%);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 4px 12px rgba(0,0,0,0.6);
      border: 2px solid #444;
      margin: 4px auto;
    }

    .disc {
      width: 95%;
      height: 95%;
      border-radius: 50%;
      position: relative;
      background: conic-gradient(
        #dcdcdc 0deg, #f0f0f0 45deg, #a0a0a0 90deg, 
        #ffffff 135deg, #bbb 180deg, #ffffff 225deg, 
        #999 270deg, #eaeaea 315deg, #dcdcdc 360deg
      );
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .disc.spinning {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .disc-cover-art {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.88;
    }

    /* 絕對精確置中的中心孔鍵 - 修復微偏移 */
    .disc-center-hole {
      position: absolute;
      top: 50% !important;
      left: 50% !important;
      width: 58px;
      height: 58px;
      margin-left: -29px; /* 精確半徑負邊距，杜絕 translate 造成的次像素位移 */
      margin-top: -29px;
      background: radial-gradient(circle, #1a1a1a 40%, #555 75%, #000 100%);
      border-radius: 50%;
      border: 3px solid #ccc;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
    }

    /* 控制面板 */
    .controls-panel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 8px 12px;
      gap: 8px;
      box-sizing: border-box;
    }

    .btn-group-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: #333;
      border: 1px solid #4a4a4a;
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      user-select: none;
      transition: background 0.15s;
    }
    .ctrl-btn:active { background: #555; }
    .ctrl-btn.play-btn { background: #007aff; border-color: #007aff; }

    /* 解決 Speed 的 S 被遮擋問題 */
    .speed-select-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0; /* 禁止被壓縮 */
      font-size: 12px;
      color: #bbb;
      margin-left: auto;
      padding-left: 4px;
    }
    .speed-select-wrap label {
      white-space: nowrap;
      display: inline-block;
      min-width: 44px; /* 確保 Speed 完整呈現 */
    }
    .speed-select-wrap select {
      background: #2c2c2c;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    /* 曲目列表 (Tracklist) */
    .track-list-card {
      width: 100%;
      background: #1c1c1c;
      border-radius: 8px;
      padding: 8px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #333;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 12px;
      color: #bbb;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
    }
    .track-row:hover { background: #282828; color: #fff; }
    .track-row.active {
      background: #007aff24;
      color: #007aff;
      font-weight: bold;
    }

    /* 隱藏但保留 YouTube 播控的容器 */
    #yt-hidden-frame {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="player-outer-wrap">
    <div class="album-switch-bar" id="albumSwitchContainer"></div>

    <div class="cd-case">
      <div class="disc" id="discWheel">
        <img id="discCoverImg" class="disc-cover-art" src="" alt="Album Cover">
      </div>
      <div class="disc-center-hole"></div>
    </div>

    <div class="controls-panel">
      <div class="btn-group-main">
        <button type="button" class="ctrl-btn" onclick="playPrevTrack()" title="上一首">⏮</button>
        <button type="button" class="ctrl-btn play-btn" id="mainPlayBtn" onclick="togglePlayPause()" title="播放/暫停">▶</button>
        <button type="button" class="ctrl-btn" onclick="stopAndReloadTrack()" title="停止並重整重新播放">▪</button>
        <button type="button" class="ctrl-btn" onclick="playNextTrack()" title="下一首">⏭</button>
      </div>

      <div class="speed-select-wrap">
        <label for="speedRate">Speed:</label>
        <select id="speedRate" onchange="changePlaybackRate(this.value)">
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>

    <div class="track-list-card" id="trackListWrap"></div>
  </div>

  <div id="yt-hidden-frame">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 專輯與歌曲設定資料
    const ALBUMS_DATA = [
      {
        id: "winter_solo",
        title: "WINTER Solo",
        cover: "https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g",
        tracks: [
          { title: "Spark", ytId: "9gJ3bTf_q_A" },
          { title: "Fly Me To The Moon", ytId: "3x9e9oK_s58" },
          { title: "All About You", ytId: "5j5cZ7i0u88" }
        ]
      },
      {
        id: "aespa_special",
        title: "Winter Bday Mix",
        cover: "https://lh3.googleusercontent.com/d/1R3m2fbip6zXRkHx0ujIQtW4VcoOkDnax",
        tracks: [
          { title: "Drama (Winter Focus)", ytId: "D8VEhcPeSlc" },
          { title: "Supernova", ytId: "phuiAIQAxZ4" },
          { title: "Armageddon", ytId: "nFYwcndNuOY" }
        ]
      }
    ];

    let currentAlbumIdx = 0;
    let currentTrackIdx = 0;
    let isPlaying = false;
    let ytPlayer = null;
    let isApiReady = false;

    // 初始化 YouTube IFrame API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '200',
        width: '200',
        videoId: ALBUMS_DATA[currentAlbumIdx].tracks[currentTrackIdx].ytId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          modestbranding: 1,
          rel: 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      isApiReady = true;
    }

    function onPlayerStateChange(event) {
      // 播完自動播下一首
      if (event.data === YT.PlayerState.ENDED) {
        playNextTrack();
      } else if (event.data === YT.PlayerState.PLAYING) {
        setPlayStateUI(true);
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED) {
        setPlayStateUI(false);
      }
    }

    function setPlayStateUI(playing) {
      isPlaying = playing;
      const disc = document.getElementById('discWheel');
      const btn = document.getElementById('mainPlayBtn');
      if (playing) {
        disc.classList.add('spinning');
        btn.innerHTML = '⏸';
      } else {
        disc.classList.remove('spinning');
        btn.innerHTML = '▶';
      }
    }

    // 渲染專輯切換鈕
    function renderAlbums() {
      const container = document.getElementById('albumSwitchContainer');
      container.innerHTML = '';
      ALBUMS_DATA.forEach((album, idx) => {
        const b = document.createElement('button');
        b.className = `album-btn ${idx === currentAlbumIdx ? 'active' : ''}`;
        b.innerText = album.title;
        b.onclick = () => switchAlbum(idx);
        container.appendChild(b);
      });
      document.getElementById('discCoverImg').src = ALBUMS_DATA[currentAlbumIdx].cover;
    }

    // 渲染曲目清單 (修復手動點選更換曲目並即刻自動播放)
    function renderTracks() {
      const listWrap = document.getElementById('trackListWrap');
      listWrap.innerHTML = '';
      const currentAlbum = ALBUMS_DATA[currentAlbumIdx];

      currentAlbum.tracks.forEach((t, idx) => {
        const row = document.createElement('div');
        row.className = `track-row ${idx === currentTrackIdx ? 'active' : ''}`;
        row.innerHTML = `<span>${idx + 1}. ${t.title}</span> <span>🎵</span>`;
        // 手點擊曲目：自動更換歌曲且立刻自動播放
        row.onclick = () => {
          selectAndPlayTrack(idx);
        };
        listWrap.appendChild(row);
      });
    }

    function switchAlbum(idx) {
      if (currentAlbumIdx === idx) return;
      currentAlbumIdx = idx;
      currentTrackIdx = 0;
      renderAlbums();
      renderTracks();
      loadTrack(currentTrackIdx, true);
    }

    // 選擇曲目並自動更換播放
    function selectAndPlayTrack(index) {
      currentTrackIdx = index;
      renderTracks();
      loadTrack(currentTrackIdx, true); // true 代表自動更換並播放
    }

    // 載入指定曲目
    function loadTrack(index, autoPlay = true) {
      const track = ALBUMS_DATA[currentAlbumIdx].tracks[index];
      if (!track) return;

      if (ytPlayer && isApiReady && ytPlayer.loadVideoById) {
        if (autoPlay) {
          ytPlayer.loadVideoById(track.ytId);
          ytPlayer.playVideo();
          setPlayStateUI(true);
        } else {
          ytPlayer.cueVideoById(track.ytId);
          setPlayStateUI(false);
        }
      }
    }

    function togglePlayPause() {
      if (!ytPlayer || !isApiReady) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        setPlayStateUI(false);
      } else {
        ytPlayer.playVideo();
        setPlayStateUI(true);
      }
    }

    // 正方形 (▪️) 重整鍵：停止、重整回到頭並自動重新播放
    function stopAndReloadTrack() {
      if (!ytPlayer || !isApiReady) return;
      const track = ALBUMS_DATA[currentAlbumIdx].tracks[currentTrackIdx];
      // 重新加載本首歌曲並自動從 0 秒開始播放
      ytPlayer.loadVideoById({
        videoId: track.ytId,
        startSeconds: 0
      });
      ytPlayer.playVideo();
      setPlayStateUI(true);
    }

    function playNextTrack() {
      const tracks = ALBUMS_DATA[currentAlbumIdx].tracks;
      currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
      renderTracks();
      loadTrack(currentTrackIdx, true);
    }

    function playPrevTrack() {
      const tracks = ALBUMS_DATA[currentAlbumIdx].tracks;
      currentTrackIdx = (currentTrackIdx - 1 + tracks.length) % tracks.length;
      renderTracks();
      loadTrack(currentTrackIdx, true);
    }

    function changePlaybackRate(rate) {
      if (ytPlayer && isApiReady && ytPlayer.setPlaybackRate) {
        ytPlayer.setPlaybackRate(parseFloat(rate));
      }
    }

    // 頁面初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderAlbums();
      renderTracks();
    });
  </script>
</body>
</html>
